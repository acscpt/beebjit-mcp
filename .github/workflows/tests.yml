name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Download beebjit binary and ROMs from fork
        run: |
          # Clone the fork to get the roms/ directory alongside the
          # binary; beebjit reads its OS ROMs from there at runtime.
          git clone --depth 1 https://github.com/acscpt/beebjit.git "$RUNNER_TEMP/beebjit"
          curl -fL -o "$RUNNER_TEMP/beebjit/beebjit" \
            https://github.com/acscpt/beebjit/releases/latest/download/beebjit-headless-linux-x86_64
          chmod +x "$RUNNER_TEMP/beebjit/beebjit"
          echo "BEEBJIT=$RUNNER_TEMP/beebjit/beebjit" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov --cov-report=term --cov-report=xml --report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: tests/TEST_REPORT.md

      - name: Post report to job summary
        if: always() && matrix.python-version == '3.12'
        run: cat tests/TEST_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
